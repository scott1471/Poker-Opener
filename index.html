<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Opener">
<meta name="theme-color" content="#141d27">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Preflop opener</title>
<style>
:root{
  --ink:#141d27; --panel:#1e2935; --line:#2c3a49;
  --text:#e9eef3; --muted:#8797a7;
  --card:#f6f4ee; --card-ink:#1b1f24; --gold:#ffd75e;
  --raise:#e0464c; --call:#39a266; --fold:#3a6db3;
  --sp:#1b1f24; --he:#c8323a; --di:#2f64c6; --cl:#2e8b4f;
  --cond:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino","Georgia",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--text)}
body{font-family:var(--cond);display:flex;justify-content:center;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
.app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:8px 10px 12px;gap:10px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* page switch */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--panel);border-radius:10px;padding:3px;border:1px solid var(--line)}
.tabs button{flex:1 1 auto;min-width:0;padding:0 6px;height:36px;white-space:nowrap;border-radius:8px;font-size:16px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--line);color:var(--text)}

.sub{display:flex;gap:3px;flex-shrink:0;margin-top:-4px;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:1 0 auto;padding:0 4px;height:32px;border-radius:16px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.sub button[aria-pressed="true"]{border-color:var(--muted);color:var(--text);background:var(--panel)}

/* ---------- lookup ---------- */
.pos{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pos button,.seat{height:50px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pos button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.prow{display:grid;grid-template-columns:54px 1fr;gap:6px;align-items:center}
.plab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
#v-vsr .pos button,#v-vs3 .pos button{height:44px;font-size:17px}
.rpos button:disabled{opacity:.25;cursor:default}
.row.out{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.row.out .verdict{font-size:24px}
.rpos button[aria-pressed="true"]{background:rgba(224,70,76,.18);color:var(--text);border-color:var(--raise);box-shadow:inset 0 0 0 1.5px var(--raise)}
.rpos button:disabled{opacity:.25;cursor:default}
.est{color:var(--gold);font-weight:700}
.meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);padding:0 3px}
.meta b{color:var(--text);font-weight:600}
.result{flex:1;min-height:170px;display:flex;flex-direction:column;gap:8px}
.row{flex:1;border-radius:12px;padding:10px 14px;display:grid;
  grid-template-columns:auto 1fr;grid-template-rows:1fr auto;column-gap:14px;align-items:center}
.row.raise{background:var(--raise)} .row.call{background:var(--call)} .row.fold{background:var(--fold)}
.hand{grid-row:1/3;font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;min-width:92px}
.hand small{display:block;font-family:var(--cond);font-size:15px;font-weight:600;opacity:.85;margin-top:4px}
.verdict{font-size:42px;font-weight:800;line-height:1}
.verdict span{font-size:22px;font-weight:600;opacity:.9;margin-left:6px}
.mix{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-height:20px}
.bar{flex:0 0 60px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--fold);box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.bar i{display:block;height:100%}
.bar .r{background:var(--raise)} .bar .c{background:var(--call)}
.hint{flex:1;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:20px;padding:16px;line-height:1.3}
.hint strong{display:block;font-family:var(--serif);font-size:56px;color:var(--text);margin-bottom:6px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pad button{height:clamp(54px,8.6vh,76px);border-radius:10px;background:var(--card);color:var(--card-ink);
  font-family:var(--serif);font-weight:700;font-size:32px;position:relative;box-shadow:0 2px 0 #b9b4a6}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad button.sel{background:var(--gold);box-shadow:0 2px 0 #b8952a}
.pad button.sel::after{content:attr(data-n);position:absolute;top:4px;right:7px;font-size:13px;font-family:var(--cond)}
.pad .clear{grid-column:span 2;background:var(--panel);color:var(--muted);font-family:var(--cond);font-size:20px;font-weight:600;box-shadow:none;border:1px solid var(--line)}
.big{height:62px;border-radius:12px;background:var(--text);color:var(--ink);font-size:24px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 0 #9aa6b2;flex-shrink:0}
.big:active{transform:translateY(3px);box-shadow:none}
.big span{font-weight:500;opacity:.7}
.big b{background:var(--ink);color:var(--text);border-radius:7px;padding:2px 10px}
.foot{font-size:13px;color:var(--muted);text-align:center}

/* ---------- leaks ---------- */
.focus{border-color:var(--gold)}
.focus h2{color:var(--gold)}
.f-spot{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1}
.focus p{font-size:16px;line-height:1.4;color:var(--muted);margin:6px 0 10px}
.focus p b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--card);color:var(--card-ink);font-family:var(--serif);font-weight:700;font-size:18px;border-radius:8px;padding:6px 10px}
.f-btn{width:100%;height:52px;font-size:20px}
.lt{margin:10px 0}
.lt-top{display:flex;justify-content:space-between;font-size:17px}
.lt-top span{color:var(--muted)}
.lt .track,.lrow .track,.acc .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:block}
.lt .track{margin:5px 0}
.lt .track i,.lrow .track i{display:block;height:100%;background:var(--gold)}
.lt small{color:var(--muted);font-size:14px}
.lrow{display:grid;grid-template-columns:1fr 70px 64px;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line);font-size:17px}
.lrow:first-of-type{border-top:0}
.lrow small{display:block;font-size:13px;color:var(--muted)}
.l-name{font-weight:700}
.l-num{text-align:right;font-weight:700}
.mrow{width:100%;text-align:left;grid-template-columns:82px 50px 1fr}
.mrow>span:first-child{font-size:15px;line-height:1.25}
.acc.wide{grid-template-columns:150px 1fr 44px}
.acc.wide b{font-size:15px}

.drillbox p{font-size:16px;line-height:1.4;color:var(--muted);margin-bottom:10px}
.drillbox .dstat b{color:var(--text)}
.drillbox .big{width:100%;height:56px}

/* ---------- charts ---------- */
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;flex-shrink:0}
.grid button{aspect-ratio:1/.86;border-radius:3px;padding:0;font-family:var(--cond);font-size:clamp(9px,2.6vw,14px);font-weight:700;
  color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45);letter-spacing:-.02em;overflow:hidden}
.grid button.on{outline:2.5px solid var(--gold);outline-offset:1px;position:relative;z-index:1}
#v-chart .pos button{height:42px;font-size:17px}
#v-chart .pos button:disabled{opacity:.25;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);padding:0 2px}
.legend b{color:var(--text)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cdetail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:78px;display:flex;flex-direction:column;justify-content:center;gap:6px;flex-shrink:0}
.cd-top{display:flex;align-items:baseline;gap:12px}
.cd-top strong{font-family:var(--serif);font-size:30px;line-height:1}
.cd-act{font-size:24px;font-weight:800}
.cd-act.r{color:#ff7d81} .cd-act.c{color:#5fd28f} .cd-act.f{color:#7fa8e6}
.cdetail .mix{font-size:15px}

.grid button.out{background:#1b242e;color:#4a5866;text-shadow:none}
.cd-note{color:var(--muted);font-size:14px}

/* ---------- trainer: home ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
h1{font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:700}
.lede{color:var(--muted);font-size:17px;line-height:1.35;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:24px}
.stat small{font-size:13px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h2{font-size:17px;font-weight:600;color:var(--muted);margin-bottom:8px}
.chart{width:100%;height:auto;display:block}
.acc{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:16px;margin:6px 0}
.acc b{font-weight:700}
.acc .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.acc .track i{display:block;height:100%;background:var(--gold)}
.acc span{text-align:right;color:var(--muted)}
.empty{color:var(--muted);font-size:16px;line-height:1.4}
.quiet{align-self:center;color:var(--muted);font-size:15px;padding:6px 10px;text-decoration:underline}

/* ---------- trainer: drill ---------- */
.dtop{display:flex;justify-content:space-between;font-size:18px;font-weight:600}
.dtop span{color:var(--muted);font-weight:500}
.pips{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.pips i{height:6px;border-radius:3px;background:var(--line)}
.pips i.cur{background:var(--muted)} .pips i.ok{background:var(--gold)} .pips i.bad{background:#ff7b7b}
.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.seat{flex-direction:column;height:54px;font-size:18px;line-height:1.05}
.seat small{font-size:12px;font-weight:500}
.seat.out{opacity:.4}
.seat.raiser{border-color:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--raise)}
.seat.raiser small{color:#ff9a9e}
.seat.you{background:var(--text);color:var(--ink);border-color:var(--text)}
.table{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.cards{display:flex;gap:12px}
.pc{width:clamp(86px,24vw,112px);aspect-ratio:5/7;background:#fff;border-radius:10px;position:relative;
  box-shadow:0 4px 0 rgba(0,0,0,.35);font-family:var(--serif);font-weight:700}
.pc .rk{position:absolute;top:6px;left:9px;font-size:clamp(34px,9vw,44px);line-height:1}
.pc .su{position:absolute;bottom:6px;right:10px;font-size:clamp(40px,11vw,56px);line-height:1}
.pc.s{color:var(--sp)} .pc.h{color:var(--he)} .pc.d{color:var(--di)} .pc.c{color:var(--cl)}
.deal .pc{animation:deal .18s ease-out both} .deal .pc+.pc{animation-delay:.05s}
@keyframes deal{from{transform:translateY(-14px);opacity:0}}
.caption{color:var(--muted);font-size:17px}
.fb{min-height:66px;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:17px}
.fb.ok{background:rgba(255,215,94,.14);color:var(--gold)}
.fb.bad{background:rgba(255,123,123,.13);color:#ffb0b0}
.fb strong{font-size:22px;font-weight:700}
.fb .mix{color:var(--text)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.opts button{height:70px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);font-size:21px;font-weight:700;line-height:1.05;position:relative}
.opts button small{display:block;font-size:16px;font-weight:500;color:var(--muted)}
.opts button:active{transform:translateY(2px)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.opts button.wrong{border-color:#ff7b7b;background:rgba(255,123,123,.13)}
.opts button.dim{opacity:.45}

/* ---------- trainer: done ---------- */
.score{text-align:center;padding:10px 0 2px}
.score b{font-family:var(--serif);font-size:72px;line-height:1}
.score b small{font-size:34px;color:var(--muted)}
.score p{color:var(--muted);font-size:18px;margin-top:6px}
.miss{display:grid;grid-template-columns:48px 52px 1fr;gap:4px 8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.miss:first-of-type{border-top:0}
.miss .h{font-family:var(--serif);font-weight:700;font-size:20px}
.miss .d{color:var(--muted);line-height:1.3}
.miss .d b{color:var(--text);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .big{font-size:20px}
.ghost{height:62px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:20px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" id="tabs">
    <button data-g="look" aria-pressed="true">Lookup</button>
    <button data-g="train" aria-pressed="false">Train</button>
    <button data-g="chart" aria-pressed="false">Charts</button>
  </nav>
  <nav class="sub" id="sub"></nav>

  <!-- LOOKUP -->
  <section class="view" id="v-lookup">
    <div class="pos" id="pos" role="group" aria-label="Your position"></div>
    <div class="meta"><span id="size"></span><span id="pct"></span></div>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="pad" id="pad" role="group" aria-label="Card ranks"></div>
    <button class="big" id="next"></button>
    <div class="foot">Tap the same rank twice for a pair.</div>
  </section>

  <!-- LOOKUP: facing a raise -->
  <section class="view" id="v-vsr" hidden>
    <div class="prow"><span class="plab">Raiser</span><div class="pos rpos" id="rpos" role="group" aria-label="Raiser's position"></div></div>
    <div class="prow"><span class="plab">You</span><div class="pos" id="ypos" role="group" aria-label="Your position"></div></div>
    <div class="meta"><span id="r-size"></span><span id="r-est"></span></div>
    <div class="result" id="r-result" aria-live="polite"></div>
    <div class="pad" id="rpad" role="group" aria-label="Card ranks"></div>
    <button class="big" id="r-next"></button>
  </section>

  <!-- TRAIN: leaks -->
  <section class="view" id="v-leaks" hidden>
    <div class="scroll" id="leaks-body"></div>
  </section>

  <!-- LOOKUP: facing a 3-bet -->
  <section class="view" id="v-vs3" hidden>
    <div class="prow"><span class="plab">3-bet</span><div class="pos rpos" id="tpos" role="group" aria-label="3-bettor's position"></div></div>
    <div class="prow"><span class="plab">You</span><div class="pos" id="ypos3" role="group" aria-label="Your position"></div></div>
    <div class="meta"><span id="t-size"></span><span id="t-est"></span></div>
    <div class="result" id="t-result" aria-live="polite"></div>
    <div class="pad" id="tpad" role="group" aria-label="Card ranks"></div>
    <button class="big" id="t-next"></button>
  </section>

  <!-- CHARTS -->
  <section class="view" id="v-chart" hidden>
    <div class="scroll" style="gap:10px">
      <div id="c-sel" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="meta"><span id="c-title"></span><span id="c-est"></span></div>
      <div class="grid" id="c-grid"></div>
      <div class="legend" id="c-legend"></div>
      <div class="cdetail" id="c-detail" aria-live="polite"></div>
    </div>
  </section>

  <!-- TRAIN: home -->
  <section class="view" id="v-home" hidden>
    <div class="scroll">
      <div>
        <h1 id="h-title"></h1>
        <p class="lede" id="h-lede"></p>
      </div>
      <div id="h-body"></div>
    </div>
    <button class="big" id="start">Deal 20 hands</button>
  </section>

  <!-- TRAIN: drill -->
  <section class="view" id="v-drill" hidden>
    <div class="dtop"><div id="d-count"></div><div><span>Score </span><b id="d-score"></b></div></div>
    <div class="pips" id="pips"></div>
    <div class="seats" id="seats"></div>
    <div class="table">
      <div class="cards" id="cards"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="opts" id="opts"></div>
    <button class="big" id="d-next" hidden>Next hand</button>
  </section>

  <!-- TRAIN: results -->
  <section class="view" id="v-done" hidden>
    <div class="scroll" id="done-body"></div>
    <div class="row2"><button class="ghost" id="to-home">See progress</button><button class="big" id="again">Deal 20 more</button></div>
  </section>

const nameAt=(i,j)=>i===j?R[i]+R[j]:j>i?R[i]+R[j]+'s':R[j]+R[i]+'o';

function freq(p,h){
  const v=DATA[p]&&DATA[p][h];
  if(v===undefined) return {r:0,c:0,f:100};
  if(Array.isArray(v)) return {r:v[0],c:v[1],f:Math.max(0,100-v[0]-v[1])};
  return {r:v,c:0,f:100-v};
}
function primary(f){return f.r>=f.c&&f.r>=f.f?'r':f.c>=f.f?'c':'f'}
function mixText(f){
  const p=[]; if(f.r) p.push(f.r+'% raise'); if(f.c) p.push(f.c+'% limp'); if(f.f&&(f.r||f.c)) p.push(f.f+'% fold');
  return p.join(', ');
}
function mixHTML(f){
  return `<div class="mix"><div class="bar"><i class="r" style="width:${f.r}%"></i><i class="c" style="width:${f.c}%"></i></div>${mixText(f)}</div>`;
}
function openPct(p){
  let t=0;
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){const f=freq(p,nameAt(i,j));t+=(i===j?6:j>i?4:12)*(f.r+f.c)/100}
  return t/1326*100;
}

function actionRow(h,sub,f,lab){
  if(!f) return `<div class="row out"><div class="hand">${h.replace(/[so]$/,'')}<small>${sub}</small></div><div class="verdict">Not in your opening range</div><div></div></div>`;
  const best=primary(f), cls={r:'raise',c:'call',f:'fold'}[best];
  const mix=Math.max(f.r,f.c,f.f)>=97?'<div class="mix">Always</div>':mixHTMLW(f,lab.words);
  return `<div class="row ${cls}"><div class="hand">${h.replace(/[so]$/,'')}<small>${sub}</small></div><div class="verdict">${lab[best]}</div>${mix}</div>`;
}
function handRows(g,lab){
  const [a,b]=[...picks].sort((x,y)=>R.indexOf(x)-R.indexOf(y));
  return a===b?actionRow(a+b,'Pair',g(a+b),lab):actionRow(a+b+'s','Suited',g(a+b+'s'),lab)+actionRow(a+b+'o','Offsuit',g(a+b+'o'),lab);
}
function pickHint(top){

}

function renderLookup(){
  const bb=pos==='BB';
  $('size').innerHTML=bb?'Big blind':pos==='SB'?'Open <b>3.5bb</b> or limp':'Open <b>2.5bb</b>';
  $('pct').innerHTML=bb?'':'Opens <b>'+openPct(pos).toFixed(0)+'%</b>';
  const res=$('result');
  if(bb){res.innerHTML='<div class="hint">Nothing to open from the big blind. If everyone folds, you win the blinds.</div>';return}
  if(picks.length<2){res.innerHTML=pickHint(pos);return}
  const lab={r:'Raise<span>'+(pos==='SB'?'3.5bb':'2.5bb')+'</span>',c:'Limp',f:'Fold',words:{r:'raise',c:'limp'}};
  res.innerHTML=handRows(h=>freq(pos,h),lab);
}

  const spot=VS_ALL[raiser][pos], sz=size3(raiser,pos);

function mixTextW(f,w){
  const p=[]; if(f.r) p.push(f.r+'% '+w.r); if(f.c) p.push(f.c+'% '+w.c); if(f.f&&(f.r||f.c)) p.push(f.f+'% fold');
  return p.join(', ');
}
function mixHTMLW(f,w){
  return `<div class="mix"><div class="bar"><i class="r" style="width:${f.r}%"></i><i class="c" style="width:${f.c}%"></i></div>${mixTextW(f,w)}</div>`;
}

// Hands near each range boundary: mixed hands, or hands whose grid neighbour has a different answer
Object.values(SETS).forEach(set=>{
  set.edge={};
  set.positions.forEach(p=>{
    set.edge[p]=[];
    for(let i=0;i<13;i++)for(let j=0;j<13;j++){
      const h=nameAt(i,j), f=set.f(p,h), a=primary(f), inR=hh=>!set.inRange||set.inRange(p,hh);
      if(!inR(h)) continue;
      let edge=Math.max(f.r,f.c,f.f)<97;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([di,dj])=>{
        const x=i+di,y=j+dj; if(x<0||y<0||x>12||y>12||!inR(nameAt(x,y))) return;
        if(primary(set.f(p,nameAt(x,y)))!==a) edge=true;
      });
      if(edge) set.edge[p].push(h);
    }
  });
});
function randomCombo(){
  const a=rnd(52); let b; do{b=rnd(52)}while(b===a);
  let c1={r:R[a%13],s:SU[a/13|0]}, c2={r:R[b%13],s:SU[b/13|0]};
  if(R.indexOf(c2.r)<R.indexOf(c1.r)) [c1,c2]=[c2,c1];
  const name=c1.r===c2.r?c1.r+c2.r:c1.r+c2.r+(c1.s===c2.s?'s':'o');
  return {name,cards:[c1,c2]};
}
function comboFor(name){
  const s1=SU[rnd(4)]; let s2=s1;
  if(name[2]!=='s') do{s2=SU[rnd(4)]}while(s2===s1);
  return {name,cards:[{r:name[0],s:s1},{r:name[1],s:s2}]};
}
function deal(){
  if(S().deal) return S().deal();
  const set=S(), p=set.positions[rnd(set.positions.length)];
  const c=Math.random()<0.4?randomCombo():comboFor(set.edge[p][rnd(set.edge[p].length)]);
  return {pos:p,...c};
}

function chart(list){
  const W=300,H=120,pl=22,pb=14,n=list.length, bw=(W-pl)/Math.max(n,10);

  [0,10,20].forEach(v=>{s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#2c3a49"/><text x="${pl-5}" y="${y(v)+4}" fill="#8797a7" font-size="11" text-anchor="end">${v}</text>`});
  list.forEach((r,i)=>{const v=r.s/r.n*ROUND;
    s+=`<rect x="${pl+i*bw+bw*.15}" y="${y(v)}" width="${bw*.7}" height="${y(0)-y(v)}" rx="2" fill="${i===n-1?'#ffd75e':'#b8a25a'}"/>`});
  if(n>=3){
    const pts=list.map((r,i)=>{const w=list.slice(Math.max(0,i-2),i+1);const a=w.reduce((t,x)=>t+x.s/x.n,0)/w.length*ROUND;return `${pl+i*bw+bw/2},${y(a)}`});

  }

}

  const cur=sess.cur, set=setOf(cur), f=set.f(cur.pos,cur.name), good=okActions(f), ok=good.includes(k);

  $('fb').className='fb '+(ok?'ok':'bad'); $('fb').innerHTML=msg;

/* ---- leak drill deck ---- */
// Weights: hands you missed (recent misses count more, each correct answer since halves it),
// the hands next to them on the chart in the same spot, and edge hands from your worst spots.
function buildDrillDeck(){
  const now=Date.now(), DAY=86400000, w=new Map(), stats=new Map(), spot=new Map();
  LOG.filter(x=>SETS[x.s]).forEach(x=>{
    const k=x.s+'|'+x.p+'|'+x.h;
    let st=stats.get(k); if(!st){st={miss:0,streak:0};stats.set(k,st)}
    if(x.o) st.streak++; else {st.miss+=Math.pow(.5,(now-x.t)/(7*DAY)); st.streak=0}
    const sk=x.s+'|'+x.p; let sp=spot.get(sk); if(!sp){sp={n:0,m:0};spot.set(sk,sp)}
    sp.n++; if(!x.o) sp.m++;
  });
  const add=(k,v)=>w.set(k,(w.get(k)||0)+v);
  const missed=new Set();
  stats.forEach((st,k)=>{
    if(!st.miss) return;
    const v=st.miss*Math.pow(.5,st.streak); if(v<.05) return;
    missed.add(k); add(k,v*3);
    const [s,p,h]=k.split('|'); const [i,j]=gridPos(h);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([di,dj])=>{const x=i+di,y=j+dj;if(x>=0&&y>=0&&x<13&&y<13&&(!SETS[s].inRange||SETS[s].inRange(p,nameAt(x,y)))) add(s+'|'+p+'|'+nameAt(x,y),v*.6)});
  });
  if(!missed.size) return [];
  [...spot.entries()].filter(([,sp])=>sp.m).sort((a,b)=>b[1].m/b[1].n-a[1].m/a[1].n).slice(0,3).forEach(([sk])=>{
    const [s,p]=sk.split('|'); SETS[s].edge[p].forEach(h=>add(sk+'|'+h,.25));
  });
  const pool=[...w.entries()], deck=[];
  for(let n=0;n<ROUND&&pool.length;n++){
    const tot=pool.reduce((a,e)=>a+e[1],0); let r=Math.random()*tot, i=0;
    while(i<pool.length-1&&(r-=pool[i][1])>0) i++;
    const [k]=pool.splice(i,1)[0], [s,p,h]=k.split('|');
    deck.push({s,pos:p,...comboFor(h),wasMissed:missed.has(k)});
  }
  return deck.sort(()=>Math.random()-.5);
}
function gridPos(h){
  const a=R.indexOf(h[0]), b=R.indexOf(h[1]);
  return h.length===2?[a,a]:h[2]==='s'?[a,b]:[b,a];
}

    const h=nameAt(i,j), f=s.g(h), on=h===cSel?'on':'';
    if(!f){html+=`<button data-h="${h}" class="out ${on}">${h}</button>`;continue}
    const w=f.w===undefined?1:f.w, n=(i===j?6:j>i?4:12)*w, a=f.r, b=f.r+f.c;
    tot.r+=n*f.r; tot.c+=n*f.c; tot.f+=n*f.f; tot.n+=n;
    const grad=`linear-gradient(90deg,var(--raise) ${a}%,var(--call) ${a}% ${b}%,var(--fold) ${b}%)`;
    // like GTO Wizard: bar height shows how often the hand is in your range
    const bg=w<1?`${grad} bottom/100% ${Math.max(8,Math.round(w*100))}% no-repeat,#26313d`:grad;
    html+=`<button data-h="${h}" class="${on}" style="background:${bg}">${h}</button>`;
  }
  $('c-grid').innerHTML=html;
  const pct=x=>Math.round(x/tot.n)+'%';
  $('c-legend').innerHTML=`<span><i style="background:var(--raise)"></i>${s.lab.r} <b>${pct(tot.r)}</b></span>`
    +(tot.c?`<span><i style="background:var(--call)"></i>${s.lab.c} <b>${pct(tot.c)}</b></span>`:'')
    +`<span><i style="background:var(--fold)"></i>Fold <b>${pct(tot.f)}</b></span>`
    +(s.partial?`<span>Range <b>${Math.round(tot.n)} combos</b></span>`:'');
  renderDetail(s);
}
function renderDetail(s){
  s=s||chartSpot();
  if(!cSel){$('c-detail').innerHTML='<span class="empty">Tap any hand for its exact frequencies.</span>';return}
  const f=s.g(cSel);
  if(!f){$('c-detail').innerHTML=`<div class="cd-top"><strong>${cSel}</strong><span class="cd-act">Not in your opening range</span></div>`;return}
  const best=primary(f);
  const parts=[]; if(f.r) parts.push(f.r+'% '+s.words.r); if(f.c) parts.push(f.c+'% '+s.words.c); if(f.f) parts.push(f.f+'% fold');
  const notes=[]; if(f.a) notes.push(`${f.a}% of the 4-bets are all-in`); if(f.w!==undefined&&f.w<1) notes.push(`in your opening range about ${Math.round(f.w*100)}% of the time`);
  $('c-detail').innerHTML=`<div class="cd-top"><strong>${cSel}</strong><span class="cd-act ${best}">${s.lab[best]}</span></div>
    <div class="mix"><div class="bar"><i class="r" style="width:${f.r}%"></i><i class="c" style="width:${f.c}%"></i></div>${parts.join(', ')}</div>${notes.length?`<small class="cd-note">${notes.join('. ')}.</small>`:''}`;
}
$('c-sel').onclick=e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.cp) cPos=b.dataset.cp;
  if(b.dataset.cr) cR=b.dataset.cr;
  if(b.dataset.cy){cY=b.dataset.cy; if(POS.indexOf(cR)>=POS.indexOf(cY)) cR=POS[POS.indexOf(cY)-1]}
  if(b.dataset.co) c3=b.dataset.co+'-'+tbFor(b.dataset.co)[0];
  if(b.dataset.ct) c3=M3[c3].you+'-'+b.dataset.ct;
  renderChart();
};
$('c-grid').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  cSel=cSel===b.dataset.h?null:b.dataset.h;
  document.querySelectorAll('#c-grid button').forEach(x=>x.classList.toggle('on',x.dataset.h===cSel));
  renderDetail();
};

/* ================= leak log ================= */
// Every trainer answer: t time, s drill set, p seat, h hand, k pick, o 1 if correct
let LOG=[], logReset=false;
const LOG_KEY='trainer-log', LOG_MAX=12000;
async function loadLog(){
  try{
    if(LS) LOG=JSON.parse(LS.getItem(LOG_KEY)||'[]');
    else if(window.storage){const r=await window.storage.get(LOG_KEY,false); if(r&&r.value) LOG=JSON.parse(r.value)}
  }catch(e){LOG=[]}
  if(view==='leaks') renderLeaks();
}
async function saveLog(){
  if(LOG.length>LOG_MAX) LOG=LOG.slice(-LOG_MAX);
  const v=JSON.stringify(LOG);
  try{ if(LS) LS.setItem(LOG_KEY,v); else if(window.storage) await window.storage.set(LOG_KEY,v,false) }catch(e){}
}
const TYPES={
  tight:['Too tight','Folded hands the chart plays'],
  loose:['Too loose','Played hands the chart folds'],
  passive:['Too passive','Called or limped where the chart raises'],
  aggressive:['Too aggressive','Raised where the chart calls or limps'],
  size:['Wrong size','Opened 3.5bb where the open is 2.5bb']
};
const ADVICE={
  tight:'Study the bottom edge of each range: the weakest hands still coloured in.',
  loose:'Study where each range stops: the first blue hands below the coloured ones.',
  passive:'Study the red part of each chart: the hands that raise, not call.',
  aggressive:'Study the green part of each chart: the hands that call or limp, not raise.',
  size:'Open 2.5bb from UTG to BTN. Only the SB opens bigger, to 3.5bb.'
};
function missType(f,k){
  const good=okActions(f);
  if(k==='f') return 'tight';
  if(good.length===1&&good[0]==='f') return 'loose';
  if(k==='x') return good.includes('r')?'size':'loose';
  if(k==='c'&&good.includes('r')) return 'passive';
  if(k==='r'&&good.includes('c')) return 'aggressive';
  return 'loose';
}
function handClass(h){
  const hi=R.indexOf(h[0]), lo=R.indexOf(h[1]);
  if(h.length===2) return 'Pairs';
  const s=h[2]==='s', bw=lo<=4;
  if(h[0]==='A') return s?'Suited aces':'Offsuit aces';
  if(bw) return s?'Suited broadways':'Offsuit broadways';
  if(s) return lo-hi<=2?'Suited connectors':'Other suited';
  return 'Other offsuit';
}
const spotLabel=(s,p)=>SETS[s].label?SETS[s].label(p):s==='open'?`${p} open`:`${p} vs ${SETS[s].raiser}`;
function openChart(s,p,h){
  if(!SETS[s]) return;
  if(s==='vs3'){c3=p;cSel=h||null;showTab('ch-3b');return}
  if(s==='open'){cPos=p}else{cR=SETS[s].raiser;cY=p}
  cSel=h||null; showTab(s==='open'?'ch-open':'ch-vs');
}
function dayLabel(t){
  const d=new Date(t), now=new Date(), day=86400000;
  const diff=Math.floor((new Date(now.toDateString())-new Date(d.toDateString()))/day);
  return diff===0?'Today':diff===1?'Yesterday':d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function grp(list,keyFn){const m=new Map();list.forEach(x=>{const k=keyFn(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m}
function topType(misses){
  const c={}; misses.forEach(x=>c[x.type]=(c[x.type]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0];
}

function renderLeaks(){
  const body=$('leaks-body');
  const all=LOG.filter(x=>SETS[x.s]).map(x=>{
    const f=SETS[x.s].f(x.p,x.h);
    return {...x,f,type:x.o?null:missType(f,x.k)};
  });
  if(!all.length){body.innerHTML=`<div><h1>Leaks</h1><p class="lede">Every hand you answer in Train is logged here. After a few rounds this page shows which spots and hands you miss most, and what kind of mistake it is.</p></div><div class="box empty">No hands logged yet. Play a round in any Train page.</div>`;return}
  const miss=all.filter(x=>!x.o), rate=(m,n)=>n?Math.round(m/n*100):0;
  const recent=all.slice(-100), recentMiss=recent.filter(x=>!x.o).length;
  let h=`<div><h1>Leaks</h1><p class="lede">${all.length} hands logged, ${miss.length} missed.</p></div>`;
  h+=`<div class="stats" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat"><b>${100-rate(miss.length,all.length)}%</b><small>Accuracy, all</small></div>
    <div class="stat"><b>${100-rate(recentMiss,recent.length)}%</b><small>Last ${recent.length}</small></div>
    <div class="stat"><b>${miss.length}</b><small>Misses</small></div></div>`;
  if(!miss.length){body.innerHTML=h+'<div class="box empty">No misses yet. Keep going.</div>';return}

  // spots ranked by miss rate (spots with too few hands go last)
  const spots=[...grp(all,x=>x.s+'|'+x.p).entries()].map(([k,list])=>{
    const [s,p]=k.split('|'), m=list.filter(x=>!x.o);
    return {s,p,n:list.length,m:m.length,r:m.length/list.length,type:topType(m),misses:m};
  }).filter(x=>x.m>0).sort((a,b)=>((b.n>=5)-(a.n>=5))||(b.r-a.r)||(b.m-a.m));

  // leak drill
  const dh=hists.drill;
  let dstat='';
  if(dh.length){const l=dh[dh.length-1], l5=dh.slice(-5), a5=Math.round(l5.reduce((a,s)=>a+s.s/s.n,0)/l5.length*100);
    dstat=`<p class="dstat">${dh.length} drill round${dh.length>1?'s':''}. Last <b>${l.s}/${l.n}</b>, last 5 average <b>${a5}%</b>.</p>`+chart(dh.slice(-30))}
  h+=`<div class="box drillbox"><h2>Drill my leaks</h2><p>20 hands from the spots and hands you miss, plus the hands next to them on the chart. Hands you keep getting right drop out of the drill.</p>${dstat}<button class="big" id="drill-go">Drill my leaks</button></div>`;

  // focus card: the worst spot and the hands missed in it
  const fx=spots[0], fh=[...grp(fx.misses,x=>x.h).entries()].sort((a,b)=>b[1].length-a[1].length).slice(0,6);
  h+=`<div class="box focus"><h2>Study next</h2>
    <div class="f-spot">${spotLabel(fx.s,fx.p)}</div>
    <p>${fx.m} of ${fx.n} missed (${Math.round(fx.r*100)}%), mostly <b>${TYPES[fx.type][0].toLowerCase()}</b>. ${ADVICE[fx.type]}</p>
    <div class="chips">${fh.map(([hand,l])=>`<button class="chip" data-s="${fx.s}" data-p="${fx.p}" data-h="${hand}">${hand}${l.length>1?` ×${l.length}`:''}</button>`).join('')}</div>
    <button class="big f-btn" data-s="${fx.s}" data-p="${fx.p}">Open this chart</button></div>`;

  // mistake types
  const tc={}; miss.forEach(x=>tc[x.type]=(tc[x.type]||0)+1);
  h+='<div class="box"><h2>Type of mistake</h2>'+Object.entries(tc).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
    `<div class="lt"><div class="lt-top"><b>${TYPES[t][0]}</b><span>${c} · ${rate(c,miss.length)}%</span></div><div class="track"><i style="width:${rate(c,miss.length)}%"></i></div><small>${TYPES[t][1]}</small></div>`).join('')+'</div>';

  // spots
  h+='<div class="box"><h2>Spots by miss rate</h2>'+spots.slice(0,10).map(x=>
    `<button class="lrow" data-s="${x.s}" data-p="${x.p}"><span class="l-name">${spotLabel(x.s,x.p)}<small>${TYPES[x.type][0]}</small></span><span class="track"><i style="width:${Math.round(x.r*100)}%"></i></span><span class="l-num">${Math.round(x.r*100)}%<small>${x.m}/${x.n}${x.n<5?', few hands':''}</small></span></button>`).join('')+'</div>';

  // repeat misses
  const reps=[...grp(all,x=>x.s+'|'+x.p+'|'+x.h).values()].map(list=>{
    const m=list.filter(x=>!x.o); if(m.length<2) return null;
    const x=list[0], set=SETS[x.s];
    const picks={}; m.forEach(y=>picks[y.k]=(picks[y.k]||0)+1);
    const wrong=Object.entries(picks).sort((a,b)=>b[1]-a[1])[0][0];
    return {s:x.s,p:x.p,h:x.h,m:m.length,n:list.length,you:set.act(x.p,wrong),ans:set.act(x.p,primary(x.f)),f:x.f,words:set.words};
  }).filter(Boolean).sort((a,b)=>b.m-a.m||a.n-b.n);
  h+='<div class="box"><h2>Hands you keep missing</h2>'+(reps.length?reps.slice(0,15).map(r=>
    `<button class="miss mrow" data-s="${r.s}" data-p="${r.p}" data-h="${r.h}"><span>${spotLabel(r.s,r.p)}</span><span class="h">${r.h}</span><span class="d">Missed ${r.m} of ${r.n}. You: ${r.you}<br>Answer: <b>${r.ans}</b>${Math.max(r.f.r,r.f.c,r.f.f)<97?' ('+mixTextW(r.f,r.words)+')':''}</span></button>`).join('')
    :'<p class="empty">No hand missed twice in the same spot yet.</p>')+'</div>';

  // hand classes
  const cls=[...grp(all,x=>handClass(x.h)).entries()].map(([c,l])=>({c,n:l.length,m:l.filter(x=>!x.o).length}))
    .filter(x=>x.n>=5).sort((a,b)=>b.m/b.n-a.m/a.n);
  if(cls.length) h+='<div class="box"><h2>Miss rate by hand type</h2>'+cls.map(x=>
    `<div class="acc wide"><b>${x.c}</b><div class="track"><i style="width:${rate(x.m,x.n)}%"></i></div><span>${rate(x.m,x.n)}%</span></div>`).join('')+'</div>';

  // recent log
  h+='<div class="box"><h2>Recent misses</h2>'+miss.slice(-25).reverse().map(x=>{
    const set=SETS[x.s];
    return `<button class="miss mrow" data-s="${x.s}" data-p="${x.p}" data-h="${x.h}"><span>${spotLabel(x.s,x.p)}</span><span class="h">${x.h}</span><span class="d">${dayLabel(x.t)}. You: ${set.act(x.p,x.k)}<br>Answer: <b>${set.act(x.p,primary(x.f))}</b></span></button>`;
  }).join('')+'</div>';
  h+=`<p class="empty" style="font-size:13px">Tap any spot or hand to open its chart.</p><button class="quiet" id="log-reset">${logReset?'Tap again to delete the whole log':'Reset leak log'}</button>`;
  body.innerHTML=h;
  $('drill-go').onclick=()=>{sessions.drill=null;showTab('drill')};
  $('log-reset').onclick=async()=>{
    if(!logReset){logReset=true;renderLeaks();setTimeout(()=>{logReset=false;if(view==='leaks')renderLeaks()},4000);return}
    logReset=false; LOG=[]; await saveLog(); renderLeaks();
  };
}
$('leaks-body').onclick=e=>{
  const b=e.target.closest('button[data-s]'); if(!b) return;
  openChart(b.dataset.s,b.dataset.p,b.dataset.h);
};

/* ================= keyboard ================= */
document.addEventListener('keydown',e=>{
  const k=e.key.toUpperCase();
  if(!$('v-lookup').hidden||!$('v-vsr').hidden||!$('v-vs3').hidden){
    if(e.key==='Enter'||k==='N'){e.preventDefault();nextHand();return}
    if(!$('v-vsr').hidden){const o={U:'UTG',H:'HJ',C:'CO',B:'BTN',S:'SB'}[k]; if(o){setRaiser(o);return}}
    if(k==='0'||k==='1'){pick('T');return}
    if(R.includes(k)){pick(k);return}
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const i=POS.indexOf(pos),d=e.key==='ArrowRight'?1:-1;setPos(POS[(i+d+POS.length)%POS.length]);return}
    if(e.key==='Escape'||e.key==='Backspace'||e.key===' '){e.preventDefault();picks=[];renderLook()}
  } else if(!$('v-drill').hidden){
    const sess=sessions[mode];
    if(sess&&!sess.answered&&['1','2','3'].includes(e.key)){answer(setOf(sess.cur).options(sess.cur.pos)[+e.key-1][0]);return}
    if(sess&&sess.answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();advance()}
  } else if(e.key==='Enter'&&(!$('v-home').hidden||!$('v-done').hidden)){e.preventDefault();startSession()}
});

showTab('lookup'); loadHist(); loadLog();
